<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Incentivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --line:#E6E8EC; --line-strong:#D3D8E0;
  --ink:#0F172A; --ink-dim:#475569; --ink-faint:#94A3B8;
  --spiff:#2563EB; --concurso:#7C3AED;
  --pend:#F59E0B; --env:#3B82F6; --pag:#10B981;
  --radius:18px; --maxw:1360px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:clamp(20px,3.5vw,44px)}

/* ---------- Encabezado ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.eyebrow{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(34px,5vw,58px);letter-spacing:-.02em;line-height:1}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.live{display:flex;align-items:center;gap:10px;font-family:"Space Mono",monospace;font-size:13px;color:var(--ink-dim);background:var(--soft);border:1px solid var(--line);padding:8px 14px;border-radius:999px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pag);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.btn-screen{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--ink);border:none;padding:9px 16px;border-radius:999px;cursor:pointer}
.btn-screen:hover{opacity:.88}
.btn-screen:focus-visible,.chip:focus-visible{outline:2px solid var(--spiff);outline-offset:2px}

/* ---------- Resumen ---------- */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0 26px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px}
.stat .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1}
.stat .lbl{font-size:13px;color:var(--ink-dim);margin-top:6px}
.stat.act .num{color:var(--pag)} .stat.prox .num{color:var(--env)} .stat.dead .num{color:var(--ink-faint)} .stat.pend .num{color:var(--pend)}

/* ---------- Pestañas ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.chip{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);background:var(--soft);border:1px solid var(--line);padding:8px 15px;border-radius:999px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- Secciones SPIFF / CONCURSO ---------- */
.program{margin-bottom:38px}
.program-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.program-title{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(24px,3vw,34px);letter-spacing:.02em}
.program-title.spiff{color:var(--spiff)} .program-title.concurso{color:var(--concurso)}
.program-count{margin-left:auto;font-family:"Space Mono",monospace;font-size:13px;color:var(--ink-faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* ---------- Tarjeta (color según la marca) ---------- */
.card{position:relative;background:var(--b);color:#fff;border-radius:var(--radius);padding:18px 20px 16px;display:flex;flex-direction:column;min-height:168px;overflow:hidden;
  box-shadow:0 1px 2px rgba(15,23,42,.06),0 10px 24px -14px var(--b);animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1.1;word-break:break-word}
.cat{font-family:"Instrument Sans",sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85;border-left:3px solid rgba(255,255,255,.75);padding-left:8px;line-height:1.2;margin-bottom:8px}
.tipo{font-family:"Space Mono",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.88;margin-top:4px}
.card-mid{flex:1;display:flex;align-items:center;position:relative;z-index:1;min-height:0;padding:12px 0 4px}
.comment{width:100%;font-size:14px;line-height:1.35;background:rgba(255,255,255,.17);border-radius:10px;padding:7px 10px}
.pay{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);font-family:"Space Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px 5px 8px;border-radius:999px;white-space:nowrap;flex:none}
.pay i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.foot{margin-top:auto;padding-top:14px;position:relative;z-index:1}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.left{font-family:"Space Mono",monospace;font-size:12px;margin-top:7px;text-align:right;opacity:.95}
.card.warn .bar>i{background:#FDE68A}
.card.warn .left{font-weight:700}
.card.prox{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.10) 0 10px,transparent 10px 20px)}
.card.dead{filter:grayscale(.9);opacity:.55}

/* ---------- Lista resumida (vista normal) ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.list-head,.row{display:grid;grid-template-columns:minmax(150px,1.3fr) 96px minmax(160px,2fr) 128px minmax(150px,1.2fr) 120px;align-items:center;gap:14px}
.list.with-rep .list-head,.list.with-rep .row{grid-template-columns:minmax(150px,1.3fr) 96px minmax(160px,2fr) 128px minmax(150px,1.2fr) 120px 120px}
.list-head{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:0 16px 4px 22px}
.row{position:relative;background:var(--bg);border:2px solid var(--b);border-radius:12px;padding:10px 16px 10px 22px;animation:rise .35s ease backwards;transition:box-shadow .15s}
.row:hover{box-shadow:0 6px 18px -10px var(--b)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:9px 0 0 9px;background:var(--b)}
.r-brand{display:flex;flex-direction:column;min-width:0}
.r-brand b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;color:var(--b);line-height:1.15;overflow-wrap:anywhere}
.r-brand span{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.sec{justify-self:start;font-family:"Space Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:6px}
.sec.spiff{color:var(--spiff);background:rgba(37,99,235,.09)} .sec.concurso{color:var(--concurso);background:rgba(124,58,237,.09)}
.r-com{font-size:14px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-dates{font-family:"Space Mono",monospace;font-size:12px;color:var(--ink-dim);white-space:nowrap}
.r-prog .mbar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.r-prog .mbar>i{display:block;height:100%;border-radius:99px;background:var(--b)}
.r-prog .mbar.warn>i{background:var(--pend)}
.r-prog small{display:block;font-family:"Space Mono",monospace;font-size:11px;color:var(--ink-dim);margin-top:4px}
.tag{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-family:"Space Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px 5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
/* estatus de reporte */
.row.rep-pend{background:#FFFBEB}
.row.rep-pend .tag.rep{background:var(--pend);border-color:var(--pend);color:#fff}
.row.rep-pend .tag.rep i{background:#fff}
.row.rep-pag{opacity:.45;filter:grayscale(.7)}
.row.rep-pag:hover{opacity:.8}
.group-label{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:18px 0 4px 2px;display:flex;align-items:center;gap:8px}
.group-label:first-child{margin-top:0}
.group-label i{width:9px;height:9px;border-radius:50%;background:var(--c)}
@media (max-width:900px){
  .list-head{display:none}
  .row,.list.with-rep .row{grid-template-columns:1fr auto;row-gap:8px}
  .r-com,.r-prog{grid-column:1 / -1}
  .r-dates{grid-column:1}
}

.empty{text-align:center;padding:60px 20px;color:var(--ink-faint);font-family:"Space Mono",monospace}
footer{margin-top:16px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-faint);font-family:"Space Mono",monospace;font-size:12px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ============================================================
   MODO PANTALLA (KIOSCO) — rota solo, sin scroll
   ============================================================ */
#kiosk{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding:clamp(20px,2.6vw,40px)}
body.kiosk-on{overflow:hidden}
body.kiosk-on #kiosk{display:flex}
.k-head{display:flex;align-items:baseline;gap:18px;margin-bottom:20px}
.k-prog{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(30px,3.6vw,48px);letter-spacing:.02em}
.k-prog.spiff{color:var(--spiff)} .k-prog.concurso{color:var(--concurso)}
.k-idx{margin-left:auto;font-family:"Space Mono",monospace;font-size:15px;color:var(--ink-dim)}
.k-clock{font-family:"Space Mono",monospace;font-size:15px;color:var(--ink-dim);margin-left:18px}
#kioskBoard{flex:1;display:grid;gap:20px;align-content:center;min-height:0;overflow:hidden;transition:opacity .5s ease}
#kioskBoard.fade{opacity:0}
#kioskBoard .card{animation:none;padding:24px 26px}
#kioskBoard .brand{font-size:clamp(26px,2.2vw,36px)}
#kioskBoard .tipo{font-size:14px}
#kioskBoard .cat{font-size:15px}
#kioskBoard .comment{font-size:17px;padding:9px 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#kioskBoard .pay{font-size:13px;padding:6px 12px 6px 10px}
#kioskBoard .pay i{width:10px;height:10px}
#kioskBoard .bar{height:10px}
#kioskBoard .left{font-size:15px}
#kioskBoard.rows-1 .card{min-height:30vh}
#kioskBoard.rows-2 .card{min-height:min(33vh,340px)}
.k-note{align-self:center;margin-top:18px;font-size:clamp(16px,1.3vw,22px);font-weight:600;color:var(--ink-dim);background:var(--soft);border:1px solid var(--line);padding:10px 22px;border-radius:999px;text-align:center}
.k-bar{height:4px;background:var(--soft);border-radius:99px;margin-top:18px;overflow:hidden}
.k-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--spiff),var(--concurso))}
.k-exit{position:absolute;top:12px;right:14px;font-family:"Space Mono",monospace;font-size:11px;color:var(--ink-faint);background:var(--soft);border:1px solid var(--line);padding:6px 12px;border-radius:999px;cursor:pointer;z-index:2}

@media (max-width:640px){.summary{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.top-right{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Área Comercial</div>
      <h1>Incentivos</h1>
    </div>
    <div class="top-right">
      <div class="live"><span class="dot"></span><span id="clock">—</span></div>
      <button class="btn-screen" id="goKiosk">▶ Modo pantalla</button>
    </div>
  </header>

  <section class="summary" id="summary"></section>

  <div class="filters" id="filters">
    <button class="chip" data-f="activos" aria-pressed="true">Activos</button>
    <button class="chip" data-f="proximos" aria-pressed="false">Próximamente</button>
    <button class="chip" data-f="vencidos" aria-pressed="false">Vencidos</button>
    <button class="chip" data-f="todos" aria-pressed="false">Todos</button>
  </div>

  <main id="board"><div class="empty">Cargando incentivos…</div></main>

  <footer>
    <span id="foot-updated">—</span>
    <span id="foot-source">—</span>
  </footer>
</div>

<div id="kiosk">
  <button class="k-exit" id="exitKiosk">✕ Salir (Esc)</button>
  <div class="k-head">
    <span class="k-prog spiff" id="kProg">SPIFF</span>
    <span class="k-idx" id="kIdx"></span>
    <span class="k-clock" id="kClock"></span>
  </div>
  <div id="kioskBoard"></div>
  <div class="k-note">ⓘ Revisar comunicado oficial para conocer el detalle del incentivo</div>
  <div class="k-bar"><i id="kBarFill"></i></div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================
   Fuente de datos: el ID de tu Google Sheet va en la URL:
     ...github.io/incentivos/?sheet=ID_DE_TU_HOJA
   Agrega &kiosk=1 para abrir directo en modo pantalla.

   La PRIMERA FILA de la hoja debe tener estos encabezados
   (en este orden, A → I):
     seccion | marca | fecha_inicio | fecha_fin | categoria | tipo | comentario | vigencia | estatus_reporte
   - seccion: SPIFF o CONCURSO
   - vigencia: Próximamente / Activo / Vencido  (si se deja vacía, la página la calcula con las fechas)
   - estatus_reporte: Pendiente / Enviado / Pagado
   ============================================================ */
const _p = new URLSearchParams(location.search);
const SHEET_ID  = _p.get("sheet") || "";
const SHEET_GID = _p.get("gid")   || "0";

const SLIDE_MS        = 12000; // tiempo por pantalla en modo kiosco
const KIOSK_ROWS      = 2;     // filas por pantalla
const KIOSK_MIN_CARD  = 360;   // ancho mínimo de tarjeta en kiosco (px)
const KIOSK_MAX_COLS  = 5;     // máximo de columnas en kiosco
const KIOSK_SHOW_PROX = false; // true = también mostrar "Próximamente" en las pantallas

/* Colores por marca: cada marca recibe un color automático y siempre el mismo.
   Si quieres fijar el color de una marca, agrégala aquí en minúsculas: */
const BRAND_COLORS = {
  // "samsung": "#1D4ED8",
  // "lg": "#BE123C",
};
/* 24 colores bien distintos entre sí (todos con buen contraste para texto blanco).
   Cada marca de la hoja recibe un color DIFERENTE; solo se repetirían si hubiera más de 24 marcas. */
const PALETTE = [
  "#DC2626","#1D4ED8","#15803D","#9333EA","#EA580C","#0E7490","#DB2777","#A16207",
  "#4338CA","#047857","#BE123C","#0369A1","#C026D3","#4D7C0F","#7F1D1D","#6D28D9",
  "#B45309","#0F766E","#1E3A8A","#86198F","#78350F","#334155","#E11D48","#57534E"
];

/* ---------- Datos de ejemplo (solo si no hay hoja conectada) ---------- */
function demoDate(o){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10);}
const SAMPLE = [
  {seccion:"SPIFF",marca:"Samsung",fecha_inicio:demoDate(-8),fecha_fin:demoDate(20),categoria:"Televisores",tipo:"Giftcard",comentario:"TV QLED 55\" o mayor",vigencia:"",estatus_reporte:"Pendiente"},
  {seccion:"SPIFF",marca:"LG",fecha_inicio:demoDate(-12),fecha_fin:demoDate(3),categoria:"Televisores",tipo:"Bono",comentario:"",vigencia:"",estatus_reporte:"Enviado"},
  {seccion:"SPIFF",marca:"Diveco",fecha_inicio:demoDate(-5),fecha_fin:demoDate(25),categoria:"Camas y colchones",tipo:"Giftcard",comentario:"Camas Olympia y Serta",vigencia:"",estatus_reporte:"Pendiente"},
  {seccion:"SPIFF",marca:"Mabe",fecha_inicio:demoDate(-3),fecha_fin:demoDate(40),categoria:"Línea blanca",tipo:"Bono",comentario:"Refrigeradoras No Frost",vigencia:"",estatus_reporte:"Pendiente"},
  {seccion:"SPIFF",marca:"JBL",fecha_inicio:demoDate(6),fecha_fin:demoDate(36),categoria:"Audio",tipo:"Giftcard",comentario:"",vigencia:"",estatus_reporte:"Pendiente"},
  {seccion:"SPIFF",marca:"HP",fecha_inicio:demoDate(-40),fecha_fin:demoDate(-4),categoria:"IT",tipo:"Giftcard",comentario:"Línea Pavilion",vigencia:"",estatus_reporte:"Pagado"},
  {seccion:"CONCURSO",marca:"Intel",fecha_inicio:demoDate(-9),fecha_fin:demoDate(1),categoria:"IT",tipo:"Giftcard",comentario:"Mínimo 5 laptops",vigencia:"",estatus_reporte:"Enviado"},
  {seccion:"CONCURSO",marca:"Sony",fecha_inicio:demoDate(-6),fecha_fin:demoDate(24),categoria:"Televisores",tipo:"Concurso",comentario:"Top 3 vendedores del mes",vigencia:"",estatus_reporte:"Pendiente"},
  {seccion:"CONCURSO",marca:"Whirlpool",fecha_inicio:demoDate(-30),fecha_fin:demoDate(-2),categoria:"Línea blanca",tipo:"Concurso",comentario:"",vigencia:"",estatus_reporte:"Pagado"}
];

/* ---------- Utilidades ---------- */
function norm(s){return String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function parseDate(s){if(!s)return null;s=String(s).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);const d=new Date(s);return isNaN(d)?null:d;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function dias(n){return n===1?"1 día":`${n} días`;}
function secOf(x){return norm(x.seccion).startsWith("concurso")?"CONCURSO":"SPIFF";}
/* Asignación sin choques: las marcas se recorren en orden alfabético; cada una
   intenta su color "preferido" (según su nombre) y si ya lo tomó otra marca,
   toma el siguiente libre. Así cada marca conserva casi siempre el mismo color
   y nunca dos marcas comparten color. */
let BRAND_MAP={};
function assignBrandColors(rows){
  BRAND_MAP={};
  const used=new Set();
  Object.entries(BRAND_COLORS).forEach(([k,c])=>{BRAND_MAP[norm(k)]=c;used.add(c.toUpperCase());});
  // la paleta está ordenada para que colores consecutivos sean muy distintos:
  // las marcas (en orden alfabético) toman los colores en ese orden
  const brands=[...new Set(rows.map(r=>norm(r.marca)).filter(Boolean))].sort();
  const free=PALETTE.filter(c=>!used.has(c.toUpperCase()));
  let i=0;
  brands.forEach(k=>{
    if(BRAND_MAP[k])return;
    BRAND_MAP[k]=free.length?free[i%free.length]:PALETTE[i%PALETTE.length]; i++;
  });
}
function brandColor(name){
  const k=norm(name);
  if(BRAND_MAP[k])return BRAND_MAP[k];
  let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;
  return PALETTE[h%PALETTE.length];
}
const VIG={act:{t:"Activo",c:"var(--pag)"},prox:{t:"Próximamente",c:"var(--env)"},dead:{t:"Vencido",c:"var(--ink-faint)"}};
function payOf(v){
  const n=norm(v);
  if(!n)return null;
  if(n.startsWith("pag"))  return {t:"Pagado",   c:"var(--pag)"};
  if(n.startsWith("envi")) return {t:"Enviado",  c:"var(--env)"};
  if(n.startsWith("pend")) return {t:"Pendiente",c:"var(--pend)"};
  return {t:String(v).trim(),c:"var(--ink-faint)"};
}

/* ---------- Estado / vigencia y barra de avance ---------- */
function computeStatus(x){
  const today=new Date();today.setHours(0,0,0,0);
  const start=parseDate(x.fecha_inicio), end=parseDate(x.fecha_fin);
  // vigencia calculada con las fechas
  let state="act";
  if(start && today<start) state="prox";
  else if(end && today>end) state="dead";
  // si la hoja trae vigencia escrita, esa manda
  const v=norm(x.vigencia);
  if(v.startsWith("proxim")) state="prox";
  else if(v.startsWith("activ")) state="act";
  else if(v.startsWith("venc")) state="dead";

  const daysLeft = end? daysBetween(today,end) : null;
  const toStart  = start? daysBetween(today,start) : null;
  let pct=null, text="";
  if(state==="prox"){
    pct=0; text = toStart!==null && toStart>0 ? `Inicia en ${dias(toStart)}` : "Próximamente";
  }else if(state==="dead"){
    pct=100; text="Finalizado";
  }else{
    if(start && end){
      const total=Math.max(1,daysBetween(start,end));
      const elapsed=Math.max(0,Math.min(total,daysBetween(start,today)));
      pct=Math.round(elapsed/total*100);
    }else if(end){
      pct=100-Math.min(100,Math.round(Math.max(0,daysLeft)/30*100));
    }
    if(daysLeft!==null) text = daysLeft<=0 ? "Último día" : `${dias(daysLeft)} restantes`;
  }
  const warn = state==="act" && daysLeft!==null && daysLeft<=5;
  return {state,pct,text,warn,daysLeft};
}

/* ---------- Lector de Google Sheets (gviz, a prueba de CORS) ---------- */
function gvizCell(cell){
  if(!cell)return "";
  const v=cell.v;
  if(typeof v==="string"){
    const m=v.match(/^Date\((\d+),(\d+),(\d+)/);
    if(m)return `${m[1]}-${String(+m[2]+1).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
  }
  if(cell.f!=null)return String(cell.f);
  if(v!=null)return String(v);
  return "";
}
function headerKey(h){return norm(h).replace(/\s+/g,"_");}
function handleGviz(resp){
  try{
    if(!resp||resp.status==="error"||!resp.table)throw new Error("gviz");
    const cols=resp.table.cols.map(c=>headerKey(c.label||""));
    ALL=resp.table.rows.map(r=>{const o={};(r.c||[]).forEach((cell,i)=>{if(cols[i])o[cols[i]]=gvizCell(cell);});return o;})
      .filter(o=>norm(o.marca)!=="");
    setSource("Fuente: Google Sheets");
  }catch(e){
    ALL=SAMPLE;
    setSource("No se pudo leer la hoja (revisa el ID y que esté compartida) — datos de ejemplo");
  }
  afterLoad();
}
window.__gvizCb=handleGviz;
function setSource(t){document.getElementById("foot-source").textContent=t;}

/* ---------- Tarjeta ---------- */
function cardHTML(x,delay){
  const st=x._st, pay=VIG[st.state];
  const cls=["card",st.state==="prox"?"prox":"",st.state==="dead"?"dead":"",st.warn?"warn":""].join(" ");
  return `<article class="${cls}" style="--b:${brandColor(x.marca)};animation-delay:${delay||0}ms">
    <div class="card-top">
      <div>
        ${x.categoria?`<div class="cat">${esc(x.categoria)}</div>`:""}
        <div class="brand">${esc(x.marca)}</div>
        ${x.tipo?`<div class="tipo">${esc(x.tipo)}</div>`:""}
      </div>
      ${pay?`<span class="pay" style="--c:${pay.c}"><i></i>${esc(pay.t)}</span>`:""}
    </div>
    <div class="card-mid">${x.comentario?`<div class="comment">${esc(x.comentario)}</div>`:""}</div>
    <div class="foot">
      ${st.pct!==null?`<div class="bar"><i style="width:${st.pct}%"></i></div>`:""}
      ${st.text?`<div class="left">${esc(st.text)}</div>`:""}
    </div>
  </article>`;
}

/* ---------- Vista normal ---------- */
let ALL=[], filter="activos";
const RANK={act:0,prox:1,dead:2};
function enrich(){
  return ALL.map(x=>({...x,_st:computeStatus(x)}))
    .sort((a,b)=>RANK[a._st.state]-RANK[b._st.state]
      || (parseDate(a.fecha_fin)||0)-(parseDate(b.fecha_fin)||0)
      || norm(a.marca).localeCompare(norm(b.marca)));
}
function applyFilter(list){
  if(filter==="proximos")return list.filter(x=>x._st.state==="prox");
  if(filter==="vencidos")return list.filter(x=>x._st.state==="dead");
  if(filter==="todos")return list;
  return list.filter(x=>x._st.state==="act");
}

function renderNormal(){
  const list=enrich();
  const c=s=>list.filter(x=>x._st.state===s).length;
  const pend=list.filter(x=>x._st.state!=="prox" && repOf(x).k==="pend").length;
  document.getElementById("summary").innerHTML=`
    <div class="stat act"><div class="num">${c("act")}</div><div class="lbl">Activos</div></div>
    <div class="stat prox"><div class="num">${c("prox")}</div><div class="lbl">Próximamente</div></div>
    <div class="stat dead"><div class="num">${c("dead")}</div><div class="lbl">Vencidos</div></div>
    <div class="stat pend"><div class="num">${pend}</div><div class="lbl">Reporte pendiente</div></div>`;

  const view=applyFilter(list), board=document.getElementById("board");
  if(!view.length){board.innerHTML=`<div class="empty">No hay incentivos en esta vista.</div>`;return;}

  const withRep = filter==="vencidos" || filter==="todos";
  const endT = x => (parseDate(x.fecha_fin)||new Date(0)).getTime();
  let rows=[...view];
  if(withRep){
    // primero Pendiente, luego Enviado, luego Pagado; dentro de cada grupo por fecha de fin descendente
    rows.sort((a,b)=>REP_RANK(a)-REP_RANK(b) || endT(b)-endT(a));
  }else{
    // activos / próximamente: los que terminan antes, arriba
    rows.sort((a,b)=>endT(a)-endT(b));
  }

  let html=`<div class="list${withRep?" with-rep":""}">
    <div class="list-head"><span>Marca</span><span>Sección</span><span>Comentario</span><span>Fechas</span><span>Avance</span><span>Vigencia</span>${withRep?"<span>Reporte</span>":""}</div>`;
  let lastGroup=null, delay=0;
  rows.forEach(x=>{
    if(withRep){
      const g=repOf(x);
      if(g.k!==lastGroup){
        html+=`<div class="group-label" style="--c:${g.c}"><i></i>${g.t} · ${rows.filter(r=>repOf(r).k===g.k).length}</div>`;
        lastGroup=g.k;
      }
    }
    html+=rowHTML(x,withRep,delay); delay+=20;
  });
  board.innerHTML=html+`</div>`;
}

function repOf(x){
  const n=norm(x.estatus_reporte);
  if(n.startsWith("pag"))  return {k:"pag", t:"Pagado",   c:"var(--pag)"};
  if(n.startsWith("envi")) return {k:"env", t:"Enviado",  c:"var(--env)"};
  return {k:"pend",t:"Pendiente",c:"var(--pend)"}; // vacío cuenta como pendiente
}
function REP_RANK(x){return {pend:0,env:1,pag:2}[repOf(x).k];}
function fmtShort(s){const d=parseDate(s);return d?d.toLocaleDateString("es-GT",{day:"2-digit",month:"short"}).replace(".",""):"—";}

function rowHTML(x,withRep,delay){
  const st=x._st, vig=VIG[st.state], rep=repOf(x), sec=secOf(x);
  const cls=["row", withRep?"rep-"+rep.k:""].join(" ");
  return `<div class="${cls}" style="--b:${brandColor(x.marca)};animation-delay:${delay}ms">
    <div class="r-brand"><b>${esc(x.marca)}</b>${x.tipo?`<span>${esc(x.tipo)}</span>`:""}</div>
    <span class="sec ${sec.toLowerCase()}">${sec}</span>
    <div class="r-com" title="${esc(x.comentario||"")}">${x.comentario?esc(x.comentario):"—"}</div>
    <div class="r-dates">${fmtShort(x.fecha_inicio)} → ${fmtShort(x.fecha_fin)}</div>
    <div class="r-prog">${st.pct!==null?`<div class="mbar${st.warn?" warn":""}"><i style="width:${st.pct}%"></i></div>`:""}<small>${esc(st.text)}</small></div>
    <span class="tag" style="--c:${vig.c}"><i></i>${vig.t}</span>
    ${withRep?`<span class="tag rep" style="--c:${rep.c}"><i></i>${rep.t}</span>`:""}
  </div>`;
}

/* ============================================================
   MODO PANTALLA (KIOSCO)
   ============================================================ */
let kSlides=[],kCur=0,kTimer=null;
function buildSlides(){
  const list=enrich().filter(x=>x._st.state==="act"||(KIOSK_SHOW_PROX&&x._st.state==="prox"));
  const maxcols=Math.max(1,Math.min(KIOSK_MAX_COLS,Math.floor(window.innerWidth/KIOSK_MIN_CARD)));
  const per=maxcols*KIOSK_ROWS;
  kSlides=[];
  ["SPIFF","CONCURSO"].forEach(sec=>{
    const arr=list.filter(x=>secOf(x)===sec);
    for(let i=0;i<arr.length;i+=per)kSlides.push({sec,maxcols,items:arr.slice(i,i+per)});
  });
  if(kCur>=kSlides.length)kCur=0;
}
function showSlide(i){
  const kb=document.getElementById("kioskBoard");
  if(!kSlides.length){kb.className="";kb.innerHTML=`<div class="empty">No hay incentivos activos.</div>`;return;}
  kCur=(i+kSlides.length)%kSlides.length;
  const s=kSlides[kCur], secSlides=kSlides.filter(z=>z.sec===s.sec);
  const prog=document.getElementById("kProg");
  prog.textContent=s.sec; prog.className="k-prog "+s.sec.toLowerCase();
  document.getElementById("kIdx").textContent=secSlides.length>1?`${secSlides.indexOf(s)+1} / ${secSlides.length}`:"";
  const n=s.items.length, rows=n<=s.maxcols?1:2, cols=Math.ceil(n/rows);
  kb.className=rows===2?"rows-2":"rows-1";
  kb.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  kb.innerHTML=s.items.map(x=>cardHTML(x,0)).join("");
  equalizeTops(kb);
  const fill=document.getElementById("kBarFill");
  fill.style.transition="none";fill.style.width="0%";
  if(kSlides.length>1){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.transition=`width ${SLIDE_MS}ms linear`;fill.style.width="100%";}));
  }
}
/* iguala el alto de los encabezados para que el comentario quede a la misma altura en todas las tarjetas */
function equalizeTops(kb){
  const tops=[...kb.querySelectorAll(".card-top")];
  tops.forEach(t=>t.style.minHeight="");
  const h=Math.max(0,...tops.map(t=>t.getBoundingClientRect().height));
  tops.forEach(t=>t.style.minHeight=h+"px");
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(document.body.classList.contains("kiosk-on"))equalizeTops(document.getElementById("kioskBoard"));});
/* rota y muestra la barra de tiempo solo si hay más de una vista */
function scheduleRotation(){
  clearInterval(kTimer);kTimer=null;
  const multi=kSlides.length>1;
  document.querySelector(".k-bar").style.visibility=multi?"visible":"hidden";
  if(multi)kTimer=setInterval(()=>goSlide(1),SLIDE_MS);
}
function goSlide(d){
  const kb=document.getElementById("kioskBoard");
  kb.classList.add("fade");
  setTimeout(()=>{showSlide(kCur+d);},500);
}
function startKiosk(){
  document.body.classList.add("kiosk-on");
  buildSlides();kCur=0;showSlide(0);scheduleRotation();
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
}
function stopKiosk(){
  document.body.classList.remove("kiosk-on");
  clearInterval(kTimer);kTimer=null;
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
}

/* ---------- Reloj ---------- */
function tick(){
  const now=new Date();
  document.getElementById("clock").textContent=
    now.toLocaleDateString("es-GT",{weekday:"long",day:"numeric",month:"long"})+" · "+now.toLocaleTimeString("es-GT",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("kClock").textContent=now.toLocaleTimeString("es-GT",{hour:"2-digit",minute:"2-digit"});
}

/* ---------- Carga de datos ---------- */
function afterLoad(){
  assignBrandColors(ALL);
  document.getElementById("foot-updated").textContent="Actualizado: "+new Date().toLocaleTimeString("es-GT",{hour:"2-digit",minute:"2-digit"});
  renderNormal();
  if(document.body.classList.contains("kiosk-on")){buildSlides();showSlide(kCur);scheduleRotation();}
}
function load(){
  if(SHEET_ID){
    const s=document.createElement("script");
    s.src=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(SHEET_ID)}/gviz/tq?tqx=out:json;responseHandler:__gvizCb&headers=1&gid=${encodeURIComponent(SHEET_GID)}&_=${Date.now()}`;
    s.onerror=()=>{ALL=SAMPLE;setSource("Sin conexión con Google — datos de ejemplo");afterLoad();};
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),9000);
  }else{
    ALL=SAMPLE;setSource("Datos de ejemplo (aún sin conectar la hoja)");afterLoad();
  }
}

/* ---------- Eventos ---------- */
document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));
  renderNormal();
});
document.getElementById("goKiosk").addEventListener("click",startKiosk);
document.getElementById("exitKiosk").addEventListener("click",stopKiosk);
document.addEventListener("keydown",e=>{
  if(!document.body.classList.contains("kiosk-on"))return;
  if(e.key==="Escape")stopKiosk();
  if(e.key==="ArrowRight")goSlide(1);
  if(e.key==="ArrowLeft")goSlide(-1);
});
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement&&document.body.classList.contains("kiosk-on")){document.body.classList.remove("kiosk-on");clearInterval(kTimer);kTimer=null;}
});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(document.body.classList.contains("kiosk-on")){buildSlides();showSlide(kCur);scheduleRotation();}},300);});

/* ---------- Arranque ---------- */
tick();setInterval(tick,30000);
load();
setInterval(load,10*60*1000);
if(_p.get("kiosk")==="1")setTimeout(startKiosk,600);
</script>
